[project]
name = "django-upgrade-evidence"
version = "0.1.0"
description = "Evidence-first Django upgrade advisor with an Azure Foundry decision adapter."
requires-python = ">=3.11"
dependencies = [
  "Django==5.2.18",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.17,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
