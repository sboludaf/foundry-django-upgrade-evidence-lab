[project]
name = "django-upgrade-evidence"
version = "0.1.0"
description = "Evidence-first Django upgrade advisor with an Azure Foundry decision adapter."
requires-python = ">=3.11"
dependencies = [
  "azure-ai-agents>=1.2.0b1,<2",
  "azure-ai-projects==2.0.0b2",
  "azure-data-tables>=12.7.0",
  "azure-identity>=1.27.0",
  "azure-storage-blob>=12.31.1",
  "django==5.2.19",
  "gunicorn>=26.2.0",
  "openai>=3.46.0",
  "whitenoise>=6.12.0",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.17,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
