<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Informe Django {{ report.version }}</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:3rem auto;padding:0 1rem;color:#18212b}code{background:#eef2f5;padding:.15rem .3rem;border-radius:.3rem}li{margin:.5rem 0}.uncertain{color:#8a4b00}</style></head>
<body><p><a href="/">← Volver</a></p><h1>Django {{ report.version }}</h1><p>Generado: <code>{{ report.created_at }}</code></p><h2>Fuentes</h2><ul>{% for source in report.evidence %}<li><strong>{{ source.title }}</strong> · <a href="{{ source.url }}">fuente oficial</a> · SHA-256 <code>{{ source.sha256 }}</code></li>{% endfor %}</ul><h2>Decisión</h2><pre>{{ report.decision|pprint }}</pre><h2>Revisión</h2><p>{{ report.review.note }}</p></body></html>
